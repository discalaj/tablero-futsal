name: Compilar APK Desde Cero

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Crear Proyecto Limpio
        run: |
          # Guardamos una copia de tu marcador de futsal temporalmente
          cp lib/main.dart /tmp/main.dart || true
          
          # Borramos los archivos viejos para que no estorben
          rm -rf android lib pubspec.yaml
          
          # Creamos el proyecto de Flutter perfecto y original
          flutter create tablero_futsal --platforms=android
          
          # Movemos todo el proyecto a la raíz
          mv tablero_futsal/* . || true
          mv tablero_futsal/.* . || true
          
          # Devolvemos tu código de futsal a su lugar correcto
          mkdir -p lib
          cp /tmp/main.dart lib/main.dart

      - name: Construir APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-futsal
          path: build/app/outputs/flutter-apk/app-release.apk
